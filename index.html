
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暂时离开--PKGJSON</title>
    <!-- 使用国内高速 CDN -->
    <link rel="stylesheet" href="https://lf3-cdn-tos.bytecdntimes.com/cdn/expire-1-M/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-light: #f0f7ff;
            --main-blue: #3b82f6;
            --dark-blue: #1e40af;
            --text-gray: #4b5563;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            color: var(--text-gray);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* 标题：结合了文字阴影与平滑入场动画 */
        .title {
            font-size: clamp(2.2rem, 8vw, 4rem);
            font-weight: 800;
            color: var(--dark-blue);
            margin-bottom: 1.5rem;
            letter-spacing: 0.5rem;
            /* 优雅的文字阴影 */
            text-shadow: 2px 4px 8px rgba(30, 64, 175, 0.15),
                         0px 0px 1px rgba(255, 255, 255, 0.5);
            animation: fadeInDown 1.2s ease-out;
        }

        /* 座右铭：添加高级感装饰元素 */
        .motto-container {
            position: relative;
            padding: 0 40px;
            animation: fadeInUp 1.5s ease-out;
        }

        .motto {
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            color: #6b7280;
            font-weight: 300;
            letter-spacing: 0.1rem;
            line-height: 1.8;
            background: linear-gradient(90deg, #64748b, #3b82f6, #64748b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        /* 座右铭两侧的高级感装饰线 */
        .motto-container::before, .motto-container::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--main-blue));
        }
        .motto-container::before { left: -5px; transform: translateY(-50%); }
        .motto-container::after { right: -5px; transform: translateY(-50%); background: linear-gradient(270deg, transparent, var(--main-blue)); }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* 底部页脚 */
        footer {
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .social-icons {
            margin-bottom: 20px;
        }

        .social-icons a {
            display: inline-block;
            margin: 0 15px;
            font-size: 1.5rem;
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            color: var(--main-blue);
            transform: translateY(-5px);
        }

        .footer-links {
            margin-bottom: 15px;
        }

        .footer-links a {
            text-decoration: none;
            color: #64748b;
            font-size: 0.9rem;
            margin: 0 12px;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--main-blue);
        }

        .copyright {
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 0.05rem;
        }

        /* 动画定义 */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1 class="title">备战高考 27再见</h1>
        <div class="motto-container">
            <p class="motto">给时光以生命，给岁月以文明</p>
        </div>
    </div>

    <footer>
        <div class="social-icons">
            <a href="https://github.com/linkkk0" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" target="_blank" title="Weibo"><i class="fab fa-weibo"></i></a>
            <a href="#" target="_blank" title="WeChat"><i class="fab fa-weixin"></i></a>
            <a href="#" title="Email"><i class="fas fa-envelope"></i></a>
        </div>
        <div class="footer-links">
            <a href="https://github.com/linkkk0/gaokao-preparing-page">开源地址</a>
            <!--
            <a href="#">学习导航</a>
            <a href="#">隐私权政策</a>
            -->
        </div>
        <div class="copyright">
            &copy; 2026 PKGJSON | Designed by PKGJSON.<br>
            保持热爱，奔赴山海。
        </div>
    </footer>
</body>
</html>
